server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Voice notes are up to ~600 KB.
  client_max_body_size 2m;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build output never changes: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* \.(onnx|wasm)$ {
    add_header Cache-Control "public, max-age=2592000";
    types { application/wasm wasm; application/octet-stream onnx; }
    try_files $uri =404;
  }

  # The service worker and the shell must always be revalidated, or phones keep an old version.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy same-origin;
  add_header Permissions-Policy "microphone=(self), camera=(self), bluetooth=(self), geolocation=(self)";

  # Single-page app: client-side routes fall back to the shell.
  location / {
    try_files $uri /index.html;
  }
}
